name: Upload i18n to R2

on:
  push:
    branches: [main]
    paths:
      - "**/*.json"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Upload changed files to R2 and purge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Handle initial commit (no parent) vs regular push
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD~1 HEAD -- '*.json' '*/*.json')
          else
            changed=$(find . -name '*.json' -not -path './.git/*' | sed 's|^\./||')
          fi

          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=electiondata.my" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[0].id')

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "Uploading i18n/$file ..."
            wrangler r2 object put "meco-internal/i18n/$file" \
              --file "$file" \
              --content-type "application/json" \
              --remote

            echo "Purging cache for i18n/$file ..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"files\":[\"https://internal.electiondata.my/i18n/$file\"]}"
            echo
          done <<< "$changed"
